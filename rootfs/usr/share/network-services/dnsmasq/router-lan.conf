# Local DNS zone for router.lan, consumed by dae as a plain UDP upstream
# (see /etc/dae/config.d/30-dns.dae).
#
# It deliberately does NOT listen on :53 and does NOT recurse: dae owns :53 for
# LAN clients, intercepts their queries in eBPF and forwards the router.lan
# suffix here. Everything else is answered by dae's public upstreams.
port=5353
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-hosts

# Authoritative for the whole zone, wildcard A record on the router:
# sub.router.lan, llm.router.lan, dsh.router.lan all answer 10.10.10.1.
local=/router.lan/
address=/router.lan/10.10.10.1
local-ttl=60
cache-size=0
log-facility=-
