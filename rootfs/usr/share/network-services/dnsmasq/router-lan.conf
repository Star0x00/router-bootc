# LAN DNS server on 10.10.10.1:53, authoritative for router.lan.
#
# Deliberately outside dae: dae no longer proxies the LAN, so it must not decide
# LAN resolution either. dae only uses this as the upstream for router.lan.
#
# bind-dynamic: the USB NIC (and 10.10.10.1) may appear after this starts.
port=53
listen-address=10.10.10.1
bind-dynamic
no-resolv
no-hosts
strict-order
server=223.5.5.5
server=119.29.29.29

# sub.router.lan, llm.router.lan, dsh.router.lan all answer 10.10.10.1.
local=/router.lan/
address=/router.lan/10.10.10.1
local-ttl=60
cache-size=1000
log-facility=-
