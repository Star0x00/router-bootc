# Persistent data directories (only /var survives bootc upgrades)
d /var/lib/sub-store 0755 root root -
d /var/lib/dae       0755 root root -
# dsh state ($DSH_HOME). 0700 because it holds sessions and
# credentials-adjacent config.
d /var/lib/dsh           0700 root root -
# The directory dsh's tools operate on, mounted as /workspace. Kept outside
# $DSH_HOME on purpose so anything the agent writes or deletes there can never
# reach dsh's own state.
d /var/lib/dsh-workspace 0755 root root -
# Environment file for the dsh container. Created empty so the quadlet's
# EnvironmentFile= always resolves; the API key is filled in on the host.
f /var/lib/dsh/env       0600 root root -
# Caddy's data dir: internal CA root key + issued certificates.
d /var/lib/caddy 0700 root root -
